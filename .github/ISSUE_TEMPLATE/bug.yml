name: Bug report
description: 报告 ANB Root 的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认设备与系统版本，并附上 App 内“记录 → 保存诊断记录”导出的文件。
  - type: input
    id: version
    attributes:
      label: ANB Root 版本
      description: 首页右上角显示，例如 2.3.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 型号、MagicOS 版本、内核版本（例如 ANB-AN00 / 9.0.0.230 / 5.10.236-...）
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: 出问题的阶段
      options:
        - 依赖检查
        - Shizuku 授权
        - 恢复 Root
        - 验证 Root
        - 刷新 KernelSU
        - 其他
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 现象与诊断记录
      description: 描述现象；附上导出的诊断文件内容（可先自行检查是否含个人信息）
    validations:
      required: true
