name: 问题反馈 / Bug report
description: 报告安装、授权、恢复或界面问题 / Report an app issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读使用指南与兼容范围。描述复现步骤，并按需提供脱敏诊断片段；不要公开序列号、账号、私钥或完整私人日志。
  - type: input
    id: version
    attributes:
      label: ANB Root 版本
      description: 首页右上角显示，例如 2.3.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 型号、MagicOS 版本、内核版本（例如 ANB-AN00 / 9.0.0.230 / 5.10.236-...）
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: 出问题的阶段
      options:
        - 依赖检查
        - Shizuku 授权
        - 恢复 Root
        - 验证 Root
        - 刷新 KernelSU
        - 界面、按钮或弹窗
        - 其他
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 现象与诊断记录
      description: 操作步骤、预期结果与实际现象；可附必要的脱敏诊断片段。界面问题可注明深色模式、字体大小与屏幕方向。
    validations:
      required: true
